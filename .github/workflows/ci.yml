name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Types
        run: mypy src
      - name: Tests
        run: pytest -q
      - name: Train on synthetic hands
        run: gesturelab synth && gesturelab train --data data/synthetic.csv --models mlp forest >> "$GITHUB_STEP_SUMMARY"
